<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My HTML Workbook</title>
</head>
<body>
  <form action="https://httpbin.org/get">
    <label for="fname">First name:</label><br>
    <input type="text" id="fname" name="fname" value="John"><br>
    <label for="lname">Last name:</label><br>
    <input type="text" id="lname" name="lname" value="Doe"><br><br>
    <label for="cname">City:</label><br>
    <input type="text" id="cname" name="cname" value="Riga"><br><br>
    <input type="submit" value="Submit">
  </form>
  <h2>GET samples</h2>
  <p>
    <a href="https://httpbin.org/get?fname=John&amp;lname=Doe&amp;cname=Riga">GET sample: send John, Doe and Riga in the URL</a>
  </p>
  <p>
    <a href="https://developer.mozilla.org/en-US/search?q=form">GET sample: search MDN for "form"</a>
  </p>
  <form action="https://httpbin.org/get" method="get">
    <label for="language">Favourite language:</label><br>
    <input type="text" id="language" name="language" value="HTML"><br><br>
    <input type="submit" value="Send with GET">
  </form>
  <h2>POST sample</h2>
  <form action="https://httpbin.org/post" method="post">
    <label for="username">Username:</label><br>
    <input type="text" id="username" name="username" value="john"><br><br>
    <input type="submit" value="Send with POST">
  </form>
  <h2>GitHub user info</h2>
  <form id="github" action="https://api.github.com/users/" method="get">
    <label for="login">GitHub username:</label><br>
    <input type="text" id="login" name="login" placeholder="octocat" required><br><br>
    <button type="submit">Show user info</button>
  </form>
  <script>
    // A form can only add its fields after "?"; the username belongs in
    // the path, so the address is built here.
    document.getElementById('github').addEventListener('submit', function (event) {
      event.preventDefault();
      window.location.href = this.action + encodeURIComponent(this.elements.login.value);
    });
  </script>
</body>
</html>
