<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Time Travel Customs Declaration</title>
</head>
<body>
  <h1>Time Travel Customs Declaration</h1>
  <p>
    Bureau of Temporal Customs. Fill in this form before you arrive.
    Declarations filed after arrival are processed yesterday.
  </p>
  <form id="declaration" action="https://httpbin.org/anything/customs" method="get" target="_blank">
    <fieldset>
      <legend>Traveller</legend>
      <label for="traveller">Full name in your home century:</label><br>
      <input type="text" id="traveller" name="traveller" placeholder="Jane Doe" maxlength="60" required><br><br>
      <label for="email">E-mail that already exists in your home century:</label><br>
      <input type="email" id="email" name="email" placeholder="traveller@example.com" required><br><br>
      <label for="portrait">Portrait (photographs and oil paintings are accepted):</label><br>
      <input type="file" id="portrait" name="portrait" accept="image/*">
    </fieldset>
    <fieldset>
      <legend>Journey</legend>
      <label for="departure">Moment of departure:</label><br>
      <input type="datetime-local" id="departure" name="departure" required><br><br>
      <label for="arrival">Date of arrival:</label><br>
      <input type="date" id="arrival" name="arrival" required><br><br>
      <label for="era">Era of origin:</label><br>
      <select id="era" name="era">
        <optgroup label="Past">
          <option value="jurassic">Jurassic</option>
          <option value="antiquity">Antiquity</option>
          <option value="middle-ages">Middle Ages</option>
        </optgroup>
        <optgroup label="Future">
          <option value="next-tuesday">Next Tuesday</option>
          <option value="year-3000" selected>Year 3000</option>
          <option value="heat-death">Heat death of the universe</option>
        </optgroup>
      </select>
    </fieldset>
    <fieldset>
      <legend>Purpose of the visit</legend>
      <input type="radio" id="tourism" name="purpose" value="tourism" checked>
      <label for="tourism">Tourism</label><br>
      <input type="radio" id="lottery" name="purpose" value="lottery">
      <label for="lottery">Checking lottery numbers</label><br>
      <input type="radio" id="grandfather" name="purpose" value="grandfather">
      <label for="grandfather">Meeting my own grandfather</label>
    </fieldset>
    <fieldset>
      <legend>Goods to declare</legend>
      <input type="checkbox" id="almanac" name="goods" value="almanac">
      <label for="almanac">Sports almanac</label><br>
      <input type="checkbox" id="dinosaur" name="goods" value="dinosaur">
      <label for="dinosaur">Live dinosaur</label><br>
      <input type="checkbox" id="smartphone" name="goods" value="smartphone">
      <label for="smartphone">Smartphone older than its inventor</label><br><br>
      <label for="paradoxes">Paradoxes carried, pieces:</label><br>
      <input type="number" id="paradoxes" name="paradoxes" value="0" min="0" max="42" step="1"><br><br>
      <label for="butterflies">Butterflies you plan to step on, from 0 to 10:</label><br>
      <input type="range" id="butterflies" name="butterflies" min="0" max="10" value="1"><br><br>
      <label for="machine">Colour of the time machine:</label><br>
      <input type="color" id="machine" name="machine" value="#c0c0c0"><br><br>
      <label for="explanation">Explain anything that has not happened yet:</label><br>
      <textarea id="explanation" name="explanation" rows="4" cols="50" placeholder="It will have been an accident."></textarea>
    </fieldset>
    <p>
      <input type="submit" value="Declare with GET: the declaration is visible in the address">
    </p>
    <p>
      <input type="submit" formmethod="post" formenctype="multipart/form-data" value="Declare with POST: the declaration is sealed in the request body">
    </p>
    <p>
      <input type="submit" formaction="https://httpbin.org/delay/3" value="Send through a time loop: the answer arrives 3 seconds late">
    </p>
    <p>
      <input type="submit" formaction="https://httpbin.org/status/418" formnovalidate value="Nothing to declare: the officer turns out to be a teapot">
    </p>
  </form>
  <p>
    <label for="stamp">Officer's stamp code, written outside the form and still sent with it:</label><br>
    <input type="text" id="stamp" name="stamp" form="declaration" value="TC-1985">
  </p>
</body>
</html>
